name: V17 cross-month real Binance maker proxy
on:
  push:
    branches: [research/v17-cross-month-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-event-holdout:
    strategy:
      fail-fast: false
      matrix:
        date: ['2024-04-01','2025-06-01','2025-10-01']
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: pip install requests
      - name: Regression checks
        run: python -m unittest discover -s research/v17_maker_proxy -p test_v17.py -v
      - name: Actual historical L2 + trades, no parameter changes
        run: python research/v17_maker_proxy/v17_maker_proxy.py --day ${{ matrix.date }} --seconds 90 --out validation_${{ matrix.date }}.json
      - name: Upload only computed data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-maker-cross-month-${{ matrix.date }}
          path: validation_${{ matrix.date }}.json
          if-no-files-found: ignore
